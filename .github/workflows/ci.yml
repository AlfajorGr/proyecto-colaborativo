name: CI/CD Pipeline Node.js

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  install:
    name: Instalación de dependencias
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Configuración de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Instalar dependencias
        run: npm install

  test:
    name: Ejecutar pruebas
    runs-on: ubuntu-latest
    needs: install

    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Configuración de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Instalar dependencias
        run: npm install

      - name: Ejecutar tests
        run: npm test

  build:
    name: Construcción del artefacto
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Configuración de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Instalar dependencias
        run: npm install

      - name: Build del proyecto
        run: npm run build

  deploy:
    name: Simulación de despliegue
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Paso de despliegue ficticio
        run: echo "Deploy realizado"
