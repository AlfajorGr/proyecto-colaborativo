<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Galería de Gatitos 🐱</title>
    <style>
      body {
        text-align: center;
        background: #fafafa;
        font-family: sans-serif;
      }
      #cats img {
        width: 300px;
        margin: 10px;
        border-radius: 12px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
      }
    </style>
  </head>
  <body>
    <h1>🐾 Galería de Gatitos 🐾</h1>
    <div id="cats"></div>
    <script>
      window.addCat = function (url) {
        const img = document.createElement("img");
        img.src = url;
        document.getElementById("cats").appendChild(img);
      };
    </script>
  </body>
</html>
